<svg xmlns="http://www.w3.org/2000/svg" width="176" height="46" viewBox="0 0 176 46" role="img" aria-label="App Store">
  <title>App Store</title>
  <defs>
    <filter id="gl" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .f-sans { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .chip { animation: br 3.4s ease-in-out infinite; }
      @keyframes br { 0%,100% { opacity:.88 } 50% { opacity:1 } }
    </style>
  </defs>
  <g class="chip">
    <rect x="1" y="1" width="174" height="44" rx="22.0" fill="#08060f"/>
    <rect x="1" y="1" width="174" height="44" rx="22.0" fill="#a78bfa" fill-opacity=".10"/>
    <rect x="1" y="1" width="174" height="44" rx="22.0" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity=".85" filter="url(#gl)"/>
    <rect x="20" y="12.5" width="21" height="21" rx="5.5" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="1.2"/>
    <path d="M30.5 17.6v8.2m0 0 3-3m-3 3-3-3" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25.6 28.4h9.8" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round"/>
    <text class="f-sans" x="113.5" y="27.8" text-anchor="middle" fill="#e8edf7" font-size="13.5" font-weight="600" letter-spacing=".3">App Store</text>
  </g>
</svg>
