    <ellipse cx="440" cy="0" rx="230" ry="150" fill="url(#cg)"/>
    <rect x="0" y="0" width="4" height="226" fill="url(#spine)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="225" rx="14" fill="none" stroke="#1E2739"/>

  <text x="26" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" letter-spacing="2.2"
        font-weight="700" fill="#34D399">OPS</text>
  <text x="25" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="750" fill="#E9EFF8">Hosting &amp; runbooks</text>
  <text x="26" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">A shared VPS carrying ~70 client sites: deploys, PHP</text>
  <text x="26" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">tuning, backups, TLS, DNS untangling and the 2am</text>
  <text x="26" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">incidents. Every fix is written down as a runbook so it</text>
  <text x="26" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">only has to be solved once.</text>
