    <stop offset="0" stop-color="#34D399" stop-opacity=".34"/>
    <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="438" height="224" rx="14"/></clipPath>
  </defs>

  <rect x=".5" y=".5" width="439" height="225" rx="14" fill="#0E131E"/>
  <g clip-path="url(#cc)">
