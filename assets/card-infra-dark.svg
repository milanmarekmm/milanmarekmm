<svg xmlns="http://www.w3.org/2000/svg" width="440" height="226" viewBox="0 0 440 226"
     role="img" aria-label="Hosting &amp; runbooks — A shared VPS carrying ~70 client sites: deploys, PHP tuning, backups, TLS, DNS untangling and the 2am incidents. Every fix is written down as a runbook so it only has to be solved once.">
  <title>Hosting &amp; runbooks</title>
  <defs>
    
