<svg xmlns="http://www.w3.org/2000/svg" width="440" height="226" viewBox="0 0 440 226"
     role="img" aria-label="Product configurator — B2C configurator that turns a messy price list into a four-step flow and drops a qualified lead in the CRM. Ships as an iframe widget onto partner sites, with a conditional option matrix behind it.">
  <title>Product configurator</title>
  <defs>
    
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#1E2739" opacity=".55"/>
  </pattern>
    
  <radialGradient id="cg">
    <stop offset="0" stop-color="#F472B6" stop-opacity=".34"/>
    <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
  </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="438" height="224" rx="14"/></clipPath>
  </defs>

  <rect x=".5" y=".5" width="439" height="225" rx="14" fill="#0E131E"/>
  <g clip-path="url(#cc)">
    <rect width="440" height="226" fill="url(#grid)"/>
    <ellipse cx="440" cy="0" rx="230" ry="150" fill="url(#cg)"/>
    <rect x="0" y="0" width="4" height="226" fill="url(#spine)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="225" rx="14" fill="none" stroke="#1E2739"/>

  <text x="26" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" letter-spacing="2.2"
        font-weight="700" fill="#F472B6">CLIENT WORK</text>
  <text x="25" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="750" fill="#E9EFF8">Product configurator</text>
  <text x="26" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">B2C configurator that turns a messy price list into a</text>
  <text x="26" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">four-step flow and drops a qualified lead in the CRM.</text>
  <text x="26" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">Ships as an iframe widget onto partner sites, with a</text>
  <text x="26" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">conditional option matrix behind it.</text>
  <g transform="translate(26,184)">
      <rect width="50" height="22" rx="6" fill="#151C2B" stroke="#1E2739"/>
      <text x="25" y="15.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" fill="#6E7E96">React</text>
    </g>
  <g transform="translate(83,184)">
      <rect width="56" height="22" rx="6" fill="#151C2B" stroke="#1E2739"/>
      <text x="28" y="15.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" fill="#6E7E96">Vercel</text>
    </g>
  <g transform="translate(146,184)">
      <rect width="44" height="22" rx="6" fill="#151C2B" stroke="#1E2739"/>
      <text x="22" y="15.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" fill="#6E7E96">REST</text>
    </g>
  <g transform="translate(197,184)">
      <rect width="44" height="22" rx="6" fill="#151C2B" stroke="#1E2739"/>
      <text x="22" y="15.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" fill="#6E7E96">i18n</text>
    </g>
  
</svg>
