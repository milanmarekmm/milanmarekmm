<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Milan Marek - AI Developer, Prague, Czechia">
  <title>Milan Marek — AI Developer · Prague</title>
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#a855f7"/>
      <stop offset="0.33" stop-color="#ec4899"/>
      <stop offset="0.66" stop-color="#22d3ee"/>
      <stop offset="1"    stop-color="#a855f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 440 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="neonSlow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#c084fc"/>
      <stop offset="0.33" stop-color="#f472b6"/>
      <stop offset="0.66" stop-color="#67e8f9"/>
      <stop offset="1"    stop-color="#c084fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 520 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".60"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".50"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".42"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="2" y="2" width="896" height="246" rx="18"/></clipPath>

    <style>
      .f-sans { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .f-mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .scanline { animation: sweep 7s linear infinite; }
      @keyframes sweep { from { transform: translateX(-420px); } to { transform: translateX(940px); } }
      .runner { animation: run 8s linear infinite; }
      @keyframes run { to { stroke-dashoffset: -2280; } }
      .pulse { animation: pulse 1.9s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:1; r:4 } 50% { opacity:.35; r:5.4 } }
      .float1 { animation: fl 9s ease-in-out infinite; }
      .float2 { animation: fl 11s ease-in-out infinite reverse; }
      .float3 { animation: fl 13s ease-in-out infinite; }
      @keyframes fl { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-13px) } }
      .breathe { animation: br 6s ease-in-out infinite; }
      @keyframes br { 0%,100% { opacity:.85 } 50% { opacity:1 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect x="2" y="2" width="896" height="246" rx="18" fill="#08060f"/>
    <ellipse cx="150" cy="30"  rx="330" ry="200" fill="url(#g1)" class="breathe"/>
    <ellipse cx="790" cy="240" rx="330" ry="200" fill="url(#g2)" class="breathe"/>
    <ellipse cx="470" cy="125" rx="380" ry="150" fill="url(#g3)"/>
    <rect x="2" y="2" width="896" height="246" fill="url(#grid)"/>
    <rect x="0" y="0" width="420" height="250" fill="url(#scan)" class="scanline"/>

    <circle class="float1" cx="86"  cy="196" r="2.5" fill="#22d3ee" opacity=".8"/>
    <circle class="float2" cx="812" cy="62"  r="2"   fill="#ec4899" opacity=".8"/>
    <circle class="float3" cx="746" cy="188" r="2.5" fill="#a855f7" opacity=".7"/>
    <circle class="float2" cx="128" cy="72"  r="2"   fill="#f472b6" opacity=".65"/>
  </g>

  <rect x="2" y="2" width="896" height="246" rx="18" fill="none" stroke="url(#neon)" stroke-width="1.6" opacity=".85"/>
  <rect class="runner" x="2" y="2" width="896" height="246" rx="18" fill="none" stroke="url(#neonSlow)"
        stroke-width="2.6" stroke-linecap="round" stroke-dasharray="170 2110" filter="url(#softGlow)"/>

  <g transform="translate(450,0)">
    <rect x="-150" y="34" width="300" height="27" rx="13.5" fill="#ffffff" fill-opacity=".05" stroke="url(#neon)" stroke-width="1" stroke-opacity=".75"/>
    <circle class="pulse" cx="-127" cy="47.5" r="4" fill="#22d3ee"/>
    <text class="f-mono" x="17" y="52" text-anchor="middle" fill="#c7d0e0" font-size="10.5" letter-spacing="2.2">PRAGUE · CZECHIA · SHIPPING</text>

    <text class="f-sans" x="-4" y="130" text-anchor="middle" fill="url(#neonSlow)" font-size="56" font-weight="800" letter-spacing="7" filter="url(#glow)">MILAN MAREK</text>

    <text class="f-sans" x="0" y="166" text-anchor="middle" fill="#e6e9f2" font-size="16.5" font-weight="600" letter-spacing="0.4">AI Developer @ ON BOARD  ·  Solo founder of Kcalori</text>

    <path d="M-160 184 H160" stroke="url(#neon)" stroke-width="1.2" opacity=".5"/>

    <text class="f-mono" x="0" y="211" text-anchor="middle" fill="#8b93a7" font-size="12.5" letter-spacing="0.2">I build small products end-to-end — Postgres schema to App Store listing.</text>
  </g>
</svg>
