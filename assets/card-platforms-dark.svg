<svg xmlns="http://www.w3.org/2000/svg" width="440" height="226" viewBox="0 0 440 226"
     role="img" aria-label="Marketing platforms — Next.js App Router rebuilds in TypeScript and Tailwind, Drizzle on Postgres, server actions hardened with honeypots and rate limits, analytics gated behind real consent. Copy lives in data files, so non-devs can edit safely.">
  <title>Marketing platforms</title>
  <defs>
    
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#1E2739" opacity=".55"/>
  </pattern>
    
  <radialGradient id="cg">
    <stop offset="0" stop-color="#A78BFA" stop-opacity=".34"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="438" height="224" rx="14"/></clipPath>
  </defs>

  <rect x=".5" y=".5" width="439" height="225" rx="14" fill="#0E131E"/>
  <g clip-path="url(#cc)">
    <rect width="440" height="226" fill="url(#grid)"/>
    <ellipse cx="440" cy="0" rx="230" ry="150" fill="url(#cg)"/>
    <rect x="0" y="0" width="4" height="226" fill="url(#spine)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="225" rx="14" fill="none" stroke="#1E2739"/>

  <text x="26" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" letter-spacing="2.2"
        font-weight="700" fill="#A78BFA">CLIENT WORK</text>
  <text x="25" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="750" fill="#E9EFF8">Marketing platforms</text>
  <text x="26" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">Next.js App Router rebuilds in TypeScript and Tailwind,</text>
  <text x="26" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">Drizzle on Postgres, server actions hardened with honeypots</text>
  <text x="26" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">and rate limits, analytics gated behind real consent.</text>
  <text x="26" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.6" fill="#98A5B8">Copy lives in data files, so non-devs can edit safely.</text>
  <g transform="translate(26,184)">
      <rect width="62" height="22" rx="6" fill="#151C2B" stroke="#1E2739"/>
      <text x="31" y="15.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace" font-size="10.2" fill="#6E7E96">Next.js</text>
    </g>
  <g transform="translate(95,184)">
