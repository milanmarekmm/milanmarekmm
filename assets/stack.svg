    </filter>
    <clipPath id="strip"><rect x="0" y="0" width="900" height="194" rx="16"/></clipPath>
    <style>
      .f-mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cap { animation: cbreathe 3.2s ease-in-out infinite; }
      @keyframes cbreathe { 0%,100% { opacity:.80 } 50% { opacity:1 } }
      .sheen { animation: cslide 6s linear infinite; }
      @keyframes cslide { from { transform: translateX(-360px) } to { transform: translateX(940px) } }
    </style>
  </defs>

