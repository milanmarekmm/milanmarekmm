<svg xmlns="http://www.w3.org/2000/svg" width="900" height="194" viewBox="0 0 900 194" role="img" aria-label="Tech stack: TypeScript, Next.js, React, Tailwind, Node.js, PostgreSQL, Drizzle ORM, Cloudflare, Vercel, Docker, Swift / SwiftUI, WordPress, PHP, Claude API, PostHog">
