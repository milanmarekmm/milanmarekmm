<svg xmlns="http://www.w3.org/2000/svg" width="176" height="46" viewBox="0 0 176 46" role="img" aria-label="LinkedIn">
  <title>LinkedIn</title>
  <defs>
    <filter id="gl" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .f-sans { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .chip { animation: br 3.4s ease-in-out infinite; }
      @keyframes br { 0%,100% { opacity:.88 } 50% { opacity:1 } }
    </style>
  </defs>
  <g class="chip">
    <rect x="1" y="1" width="174" height="44" rx="22.0" fill="#08060f"/>
    <rect x="1" y="1" width="174" height="44" rx="22.0" fill="#38bdf8" fill-opacity=".10"/>
    <rect x="1" y="1" width="174" height="44" rx="22.0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity=".85" filter="url(#gl)"/>
    <rect x="20" y="12.5" width="21" height="21" rx="4.5" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="1.2"/>
    <text class="f-sans" x="30.5" y="27.6" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">in</text>
    <text class="f-sans" x="113.5" y="27.8" text-anchor="middle" fill="#e8edf7" font-size="13.5" font-weight="600" letter-spacing=".3">LinkedIn</text>
  </g>
</svg>
